# Blueprint de Render para la API de Sintonía (plan gratuito).
# La base de datos vive en Neon (Postgres 17 + pgvector); la web, en Vercel.
# Las claves (sync: false) se rellenan en el panel de Render al crear el Blueprint.
services:
  - type: web
    name: sintonia-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Solo se redespliega si cambia algo que afecte a la API.
    buildFilter:
      paths:
        - apps/api/**
        - packages/tokens/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    # --prod=false: nest build necesita las dependencias de desarrollo (@nestjs/cli, typescript).
    buildCommand: npx --yes pnpm@10.34.7 install --frozen-lockfile --prod=false && npx --yes pnpm@10.34.7 --filter @sintonia/api build
    # Aplica las migraciones pendientes (si no hay, no hace nada) y arranca.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/main.js
    healthCheckPath: /api/domains
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Sin Ollaya en producción: Groq, OpenRouter (modelos gratis, si hay clave) y, de respaldo, Gemini.
      - key: DECISION_CHAIN
        value: groq,openrouter,gemini
      - key: TEXT_CHAIN
        value: groq,openrouter,gemini
      - key: DECISION_PROVIDER
        value: gemini
      - key: CONTEXT_TIME_ZONE
        value: Europe/Madrid
      # Cadena de conexión de Neon (la directa, sin "-pooler", con sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Respaldos gratuitos cuando Groq y Gemini se quedan sin cupo (opcionales).
      - key: OPENROUTER_API_KEY
        sync: false
      # Búsqueda en directo de la intención explícita ("algo de Marvel"): las mismas claves del seed.
      - key: TMDB_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: OPEN_LIBRARY_CONTACT
        sync: false
      # URL pública de la web en Vercel (para CORS y para la redirección de OAuth), p. ej. https://sintonia.vercel.app
      - key: WEB_URL
        sync: false
      # Conectar YouTube: cliente OAuth de Google ("Aplicación web"). La URI de redirección es
      # WEB_URL + /api/youtube/callback (llega a la API por el rewrite /api de Vercel).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Clave para cifrar los tokens de Google en la BD; Render genera una aleatoria.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
