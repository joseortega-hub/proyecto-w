services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sintonia-db
    environment:
      POSTGRES_USER: proyecto
      POSTGRES_PASSWORD: proyecto
      POSTGRES_DB: proyecto
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto -d proyecto"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Laya en local (decisiones de la entrevista). Opcional: docker compose --profile laya up -d
  ollaya:
    image: ghcr.io/ollaya-dev/ollaya
    container_name: ollaya
    profiles: ["laya"]
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - ollaya-models:/home/ollaya/.ollaya
    restart: unless-stopped

volumes:
  pgdata:
  # Mismo volumen que el contenedor creado a mano: se reutilizan los modelos descargados.
  ollaya-models:
    name: ollaya-models
