services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sintonia-db
    environment:
      POSTGRES_USER: proyecto
      POSTGRES_PASSWORD: proyecto
      POSTGRES_DB: proyecto
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto -d proyecto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
