<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha del elemento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.sx{--bg:#F3F4F8;--card:#FFFFFF;--subtle:#E8EAF2;--border:#D3D7E4;--fg:#131628;--muted:#5A607A;--primary:#3D4BF0;--on-primary:#FFFFFF;--accent:#E3E6FF;--accent-fg:#2F3BC4;--signal:#E86A1C;--signal-fg:#A5480C;--signal-bg:#FFE9DA;--yes:#17855A;--no:#C93A55;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--fg);background:var(--bg);box-sizing:border-box}
.sx[data-theme="dark"]{--bg:#0E1020;--card:#171A2E;--subtle:#20243C;--border:#2E3350;--fg:#ECEEF8;--muted:#9AA0BD;--primary:#8290FF;--on-primary:#0E1020;--accent:#252A57;--accent-fg:#C3C9FF;--signal:#FFA060;--signal-fg:#FFA060;--signal-bg:#3A2A22;--yes:#3CCB92;--no:#FF6E86}
.sx *{box-sizing:border-box}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em}
.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lb{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cv{background:repeating-linear-gradient(135deg,var(--subtle) 0 6px,var(--border) 6px 7px)}
.mt{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:15px}
.tr{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}
.tr span{display:block;height:100%;border-radius:3px;background:var(--primary)}
.tag{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--subtle)}
a{color:#3D4BF0}a:hover{color:#2F3BC4}
</style>
</helmet>
<div class="sx" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 18px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <a href="Biblioteca.dc.html" aria-label="Volver a la biblioteca" style="width: 44px; height: 44px; border-radius: 999px; background: var(--subtle); color: var(--fg); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <button type="button" aria-label="Guardar en favoritos" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--subtle); color: var(--fg); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></button>
  </header>
  <div style="display: flex; align-items: flex-end; gap: 16px">
    <div class="cv" role="img" aria-label="Portada" style="width: 132px; height: 132px; border-radius: 14px; flex: none"></div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <span class="lb">Canción · ejemplo</span>
      <span class="d" style="font-size: 26px; line-height: 1.05">Marea lenta</span>
      <span style="font-size: 15px; color: var(--muted)">Lumen Drift · <span class="m">2024</span> · <span class="m">3:48</span></span>
    </div>
  </div>
  <div style="display: flex; gap: 10px">
    <a href="Reproductor.dc.html" style="flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 16px; padding: 13px; border-radius: 999px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Reproducir</a>
    <button type="button" style="font: inherit; font-weight: 700; font-size: 16px; padding: 13px 20px; border-radius: 999px; background: var(--card); color: var(--fg); border: 1.5px solid var(--border)">Añadir</button>
  </div>
  <section style="background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span class="lb">Atributos que usa el motor</span>
    <div class="mt"><span>Energía</span><div class="tr"><span style="width: 22%"></span></div><span class="m" style="font-size: 13px; color: var(--muted); text-align: right">0,22</span></div>
    <div class="mt"><span>Positividad</span><div class="tr"><span style="width: 61%"></span></div><span class="m" style="font-size: 13px; color: var(--muted); text-align: right">0,61</span></div>
    <div class="mt"><span>Voz</span><div class="tr"><span style="width: 4%"></span></div><span class="m" style="font-size: 13px; color: var(--muted); text-align: right">0,04</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><span class="tag m">84 BPM</span><span class="tag">ambient</span><span class="tag">piano</span><span class="tag">CC BY-SA</span></div>
  </section>
  <section style="display: flex; flex-direction: column; gap: 10px">
    <span class="lb">Similares</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <div class="cv" style="aspect-ratio: 1; max-width: 100%; border-radius: 10px"></div>
      <div class="cv" style="aspect-ratio: 1; max-width: 100%; border-radius: 10px"></div>
      <div class="cv" style="aspect-ratio: 1; max-width: 100%; border-radius: 10px"></div>
      <div class="cv" style="aspect-ratio: 1; max-width: 100%; border-radius: 10px"></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
