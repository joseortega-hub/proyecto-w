<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrevista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.sx{--bg:#F3F4F8;--card:#FFFFFF;--subtle:#E8EAF2;--border:#D3D7E4;--fg:#131628;--muted:#5A607A;--primary:#3D4BF0;--on-primary:#FFFFFF;--accent:#E3E6FF;--accent-fg:#2F3BC4;--signal:#E86A1C;--signal-fg:#A5480C;--signal-bg:#FFE9DA;--yes:#17855A;--no:#C93A55;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--fg);background:var(--bg);box-sizing:border-box}
.sx[data-theme="dark"]{--bg:#0E1020;--card:#171A2E;--subtle:#20243C;--border:#2E3350;--fg:#ECEEF8;--muted:#9AA0BD;--primary:#8290FF;--on-primary:#0E1020;--accent:#252A57;--accent-fg:#C3C9FF;--signal:#FFA060;--signal-fg:#FFA060;--signal-bg:#3A2A22;--yes:#3CCB92;--no:#FF6E86}
.sx *{box-sizing:border-box}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em}
.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lb{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ticks{height:18px;position:relative;border-radius:3px;background:repeating-linear-gradient(90deg,var(--border) 0 2px,transparent 2px 9px)}
.ans{border-radius:24px;padding:28px 0;text-align:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:28px;background:var(--card);border:2.5px solid;cursor:pointer}
a{color:#3D4BF0}a:hover{color:#2F3BC4}
</style>
</helmet>
<div class="sx" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 16px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <a href="Inicio.dc.html" aria-label="Salir de la entrevista" style="width: 44px; height: 44px; border-radius: 999px; background: var(--subtle); color: var(--fg); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    <span class="lb">{{stepLabel}}</span>
    <button type="button" aria-label="Deshacer la última respuesta" onClick="{{undo}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--subtle); color: var(--fg); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
  </header>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div class="ticks" role="img" aria-label="{{dialLabel}}"><span style="{{needleStyle}}"></span></div>
    <div style="display: flex; justify-content: space-between" class="m"><span style="font-size: 12px; color: var(--muted)">Te voy conociendo</span><span style="font-size: 12px; color: var(--signal-fg); font-weight: 600">{{pct}} %</span></div>
  </div>

  <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
      <h1 class="d" style="margin: 0; font-size: 36px; line-height: 1.08">{{question}}</h1>
      <p style="margin: 0; font-size: 15px; color: var(--muted); border-left: 3px solid var(--signal); padding-left: 10px">{{hint}}</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <span style="font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 700">{{c.label}}</span>
      </sc-for>
      <span style="font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1.5px dashed var(--muted); color: var(--muted)">{{guess}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" class="ans" onClick="{{yes}}" style="border-color: var(--yes); color: var(--yes)">Sí</button>
      <button type="button" class="ans" onClick="{{no}}" style="border-color: var(--no); color: var(--no)">No</button>
    </div>
    <button type="button" onClick="{{skip}}" style="background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; padding: 12px; cursor: pointer">No lo sé</button>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
      <span class="lb">Entrevista completada</span>
      <h1 class="d" style="margin: 0; font-size: 36px; line-height: 1.08">Listo. Ya sé lo que te va a encajar.</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
          <span style="font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 700">{{c.label}}</span>
        </sc-for>
      </div>
    </div>
    <a href="Afinando.dc.html" style="display: block; text-align: center; text-decoration: none; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 17px; padding: 15px; border-radius: 999px">Ver mi lista</a>
    <button type="button" onClick="{{restart}}" style="background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; padding: 12px; cursor: pointer">Empezar de nuevo</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
var QUESTIONS = [
  { q: '¿Es para trabajar o estudiar?', hint: 'Empiezo por el uso, porque cambia todo lo demás.', yes: 'para concentrarse', no: 'para disfrutar', guess: '¿para concentrarse?' },
  { q: '¿Te apetece moverte?', hint: 'Ahora compruebo cuánta energía buscas.', yes: 'con energía', no: 'tranquila', guess: '¿tranquila?' },
  { q: '¿Prefieres sonidos suaves?', hint: 'Dijiste que no quieres moverte; miro si también buscas suavidad.', yes: 'suave', no: 'con cuerpo', guess: '¿suave?' },
  { q: '¿Quieres que la música tenga voz?', hint: 'Lo pregunto porque dijiste que es para concentrarte.', yes: 'con voz', no: 'instrumental', guess: '¿instrumental?' },
  { q: '¿Te apetece descubrir algo nuevo?', hint: 'Ya conozco el ánimo; falta decidir entre lo conocido y lo nuevo.', yes: 'descubrir', no: 'sobre seguro', guess: '¿descubrir?' }
];
var CONF = [12, 30, 44, 58, 77, 91];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answers: ['yes', 'no', 'yes'] };
  }
  answer(v) {
    if (this.state.answers.length >= QUESTIONS.length) return;
    this.setState({ answers: this.state.answers.concat([v]) });
  }
  renderVals() {
    var a = this.state.answers;
    var n = a.length;
    var done = n >= QUESTIONS.length;
    var cur = QUESTIONS[Math.min(n, QUESTIONS.length - 1)];
    var chips = [];
    a.forEach(function (v, i) { if (v !== 'skip') chips.push({ label: v === 'yes' ? QUESTIONS[i].yes : QUESTIONS[i].no }); });
    var pct = CONF[n];
    var self = this;
    return {
      theme: this.props.theme ?? 'light',
      asking: !done,
      done: done,
      question: cur.q,
      hint: cur.hint,
      guess: cur.guess,
      chips: chips,
      pct: pct,
      stepLabel: done ? 'Perfil listo' : 'Pregunta ' + (n + 1) + ' · máx. 10',
      dialLabel: 'Confianza del perfil: ' + pct + ' %',
      needleStyle: 'position: absolute; top: -3px; bottom: -3px; width: 4px; border-radius: 2px; background: var(--signal); left: ' + pct + '%',
      yes: function () { self.answer('yes'); },
      no: function () { self.answer('no'); },
      skip: function () { self.answer('skip'); },
      undo: function () { self.setState({ answers: a.slice(0, Math.max(0, n - 1)) }); },
      restart: function () { self.setState({ answers: [] }); }
    };
  }
}
</script>
</body>
</html>
