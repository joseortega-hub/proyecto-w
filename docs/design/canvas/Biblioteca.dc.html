<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.sx{--bg:#F3F4F8;--card:#FFFFFF;--subtle:#E8EAF2;--border:#D3D7E4;--fg:#131628;--muted:#5A607A;--primary:#3D4BF0;--on-primary:#FFFFFF;--accent:#E3E6FF;--accent-fg:#2F3BC4;--signal:#E86A1C;--signal-fg:#A5480C;--signal-bg:#FFE9DA;--yes:#17855A;--no:#C93A55;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--fg);background:var(--bg);box-sizing:border-box}
.sx[data-theme="dark"]{--bg:#0E1020;--card:#171A2E;--subtle:#20243C;--border:#2E3350;--fg:#ECEEF8;--muted:#9AA0BD;--primary:#8290FF;--on-primary:#0E1020;--accent:#252A57;--accent-fg:#C3C9FF;--signal:#FFA060;--signal-fg:#FFA060;--signal-bg:#3A2A22;--yes:#3CCB92;--no:#FF6E86}
.sx *{box-sizing:border-box}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em}
.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lb{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cv{background:repeating-linear-gradient(135deg,var(--subtle) 0 6px,var(--border) 6px 7px)}
.chip{font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--fg);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
a{color:#3D4BF0}a:hover{color:#2F3BC4}
</style>
</helmet>
<div class="sx" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 12px; overflow: hidden">
    <h1 class="d" style="margin: 0; font-size: 32px">Biblioteca</h1>
    <div role="tablist" style="display: flex; gap: 20px; border-bottom: 1px solid var(--border)">
      <button type="button" role="tab" aria-selected="true" style="font: inherit; font-weight: 700; font-size: 16px; background: none; border: 0; border-bottom: 3px solid var(--primary); color: var(--fg); padding: 8px 0">Catálogo</button>
      <button type="button" role="tab" aria-selected="false" style="font: inherit; font-size: 16px; background: none; border: 0; color: var(--muted); padding: 8px 0">Mis listas</button>
    </div>
    <label for="buscar" style="display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--border); background: var(--card); border-radius: 999px; padding: 0 14px; color: var(--muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="buscar" type="search" placeholder="Canción, artista o ánimo" style="flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16px; color: var(--fg); padding: 12px 0; outline: none">
    </label>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button type="button" class="chip on">Ambient</button>
      <button type="button" class="chip">Energía</button>
      <button type="button" class="chip">Con voz</button>
      <button type="button" class="chip">Duración</button>
    </div>
    <span class="m" style="font-size: 12px; color: var(--muted)">312 de 1.240 canciones</span>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="Ficha.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg)">
        <div class="cv" style="width: 48px; height: 48px; border-radius: 8px; flex: none"></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 15px">{{r.title}}</strong><span style="font-size: 13px; color: var(--muted)">{{r.sub}}</span></div>
        <span class="m" style="font-size: 12px; color: var(--muted)">{{r.dur}}</span>
      </a>
    </sc-for>
  </div>
  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); background: var(--card); padding: 8px 0 22px">
    <a href="Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>Inicio</a>
    <a href="Biblioteca.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--accent-fg); font-weight: 700; font-size: 12px; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z"></path></svg>Biblioteca</a>
    <a href="Biblioteca.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8"></path><circle cx="19" cy="17" r="2"></circle><path d="M21 17V6"></path></svg>Mis listas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      rows: [
        { title: 'Marea lenta', sub: 'Lumen Drift · ambient', dur: '3:48' },
        { title: 'Faro', sub: 'Delta Kino · ambient', dur: '5:20' },
        { title: 'Vidrio', sub: 'Mar Abierto · ambient', dur: '4:01' },
        { title: 'Horas quietas', sub: 'Nube Baja · ambient', dur: '6:12' },
        { title: 'Sal', sub: 'Lumen Drift · ambient', dur: '3:27' },
        { title: 'Umbral', sub: 'Okra Trio · ambient', dur: '4:44' }
      ]
    };
  }
}
</script>
</body>
</html>
