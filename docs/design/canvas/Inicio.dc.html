<style>
body{margin:0}
.sx{--bg:#F3F4F8;--card:#FFFFFF;--subtle:#E8EAF2;--border:#D3D7E4;--fg:#131628;--muted:#5A607A;--primary:#3D4BF0;--on-primary:#FFFFFF;--accent:#E3E6FF;--accent-fg:#2F3BC4;--signal:#E86A1C;--signal-fg:#A5480C;--signal-bg:#FFE9DA;--yes:#17855A;--no:#C93A55;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--fg);background:var(--bg);box-sizing:border-box}
.sx[data-theme="dark"]{--bg:#0E1020;--card:#171A2E;--subtle:#20243C;--border:#2E3350;--fg:#ECEEF8;--muted:#9AA0BD;--primary:#8290FF;--on-primary:#0E1020;--accent:#252A57;--accent-fg:#C3C9FF;--signal:#FFA060;--signal-fg:#FFA060;--signal-bg:#3A2A22;--yes:#3CCB92;--no:#FF6E86}

.m{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lb{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cv{background:repeating-linear-gradient(135deg,var(--subtle) 0 6px,var(--border) 6px 7px)}

    <h1 class="d" style="margin: 0; font-size: 38px; line-height: 1.05">Dime cómo estás y te pongo lo que encaja.</h1>
    <p style="margin: 0; font-size: 17px; color: var(--muted)">Unas pocas preguntas de sí o no. Sin formularios ni registro.</p>
    <a href="Dominio.dc.html" style="display: block; text-align: center; text-decoration: none; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 17px; padding: 15px; border-radius: 999px; margin-top: 8px">Empezar</a>

  </main>
  <section style="margin: 0 20px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <span class="lb">Tu última lista · ejemplo</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="cv" style="width: 48px; height: 48px; border-radius: 8px; flex: none"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <strong style="font-size: 15px">Tarde de concentración</strong>

      </div>
      <a href="Resultado.dc.html" aria-label="Abrir la lista" style="width: 44px; height: 44px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></a>
    </div>
  </section>
  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); background: var(--card); padding: 8px 0 22px">
    <a href="Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--accent-fg); font-weight: 700; font-size: 12px; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>Inicio</a>

    <a href="Biblioteca.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; padding: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8"></path><circle cx="19" cy="17" r="2"></circle><path d="M21 17V6"></path></svg>Mis listas</a>
  </nav>
