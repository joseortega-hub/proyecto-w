<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4bf0" />
    <meta name="description" content="Dime cómo estás y te pongo lo que encaja." />
    <title>Sintonía</title>
    <script>
      // Tema y modo guardados, antes de pintar (sin parpadeo). Mismas claves que src/lib/theme.ts.
      try {
        var r = document.documentElement, s = localStorage, m = s.getItem('sintonia.theme')
        var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        r.classList.toggle('dark', dark)
        r.dataset.theme = s.getItem('sintonia.palette') || 'sintonia'
        var c = s.getItem('sintonia.theme-color')
        if (c) document.querySelector('meta[name="theme-color"]').setAttribute('content', c)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
